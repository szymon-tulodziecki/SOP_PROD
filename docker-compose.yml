services:
  db:
    image: postgres:16-alpine
    container_name: sop_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ans_admin
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: ans_praktyki
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data

  admin:
    build:
      context: .
      dockerfile: app_admin/Dockerfile
    container_name: sop_admin
    restart: unless-stopped
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql+pg8000://ans_admin:secure_password_123@db:5432/ans_praktyki
      - TEX_SERVICE_URL=http://tex-service:5002
    ports:
      - "5000:5000"
    depends_on:
      tex-service:
        condition: service_healthy
      db:
        condition: service_started
    volumes:
      - pdf_data:/app/pdf_output
      - ./app_admin:/app/app_admin:ro
      - ./shared:/app/shared:ro

  student:
    build:
      context: .
      dockerfile: app_student/Dockerfile
    container_name: sop_student
    restart: unless-stopped
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql+pg8000://ans_admin:secure_password_123@db:5432/ans_praktyki
      - TEX_SERVICE_URL=http://tex-service:5002
    ports:
      - "5001:5001"
    depends_on:
      tex-service:
        condition: service_healthy
      db:
        condition: service_started
    volumes:
      - pdf_data:/app/pdf_output
      - ./app_student:/app/app_student:ro

  tex-service:
    build:
      context: ./tex_service
      dockerfile: Dockerfile
    container_name: sop_tex_service
    restart: unless-stopped
    environment:
      - TZ=Europe/Warsaw
    volumes:
      - ./tex_service/templates:/app/templates:ro
    expose:
      - "5002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  pdf_data: