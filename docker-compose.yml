secrets:
  secret_key:
    file: ./secrets/secret_key.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  file_encryption_key:
    file: ./secrets/file_encryption_key.txt
  azure_client_id:
    file: ./secrets/azure_client_id.txt
  azure_client_secret:
    file: ./secrets/azure_client_secret.txt
  azure_tenant_id:
    file: ./secrets/azure_tenant_id.txt
  fileserver_api_key:
    file: ./secrets/fileserver_api_key.txt

services:
  db:
    image: postgres:16-alpine
    container_name: sop_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ans_admin}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-ans_praktyki}
    secrets:
      - postgres_password
    networks:
      - internal
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: sop_redis
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  admin:
    build:
      context: .
      dockerfile: app_admin/Dockerfile
    container_name: sop_admin
    restart: unless-stopped
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - POSTGRES_USER=${POSTGRES_USER:-ans_admin}
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB:-ans_praktyki}
      - FILESERVER_URL=${FILESERVER_URL:-http://fileserver:5003}
      - TEX_SERVICE_URL=http://tex-service:5002
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ALLOWED_EMAIL_DOMAIN=${ALLOWED_EMAIL_DOMAIN:-ans-elblag.pl}
    secrets:
      - secret_key
      - postgres_password
      - file_encryption_key
      - azure_client_id
      - azure_client_secret
      - azure_tenant_id
      - fileserver_api_key
    ports:
      - "8080:5000"
    networks:
      - internal
      - public
    depends_on:
      tex-service:
        condition: service_healthy
      db:
        condition: service_started
      redis:
        condition: service_started
      fileserver:
        condition: service_healthy
    volumes:
      - pdf_data:/app/pdf_output
      - ./app_admin:/app/app_admin:ro
      - ./core:/app/core:ro
    read_only: true
    tmpfs:
      - /tmp
      - /app/app_admin/logs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  student:
    build:
      context: .
      dockerfile: app_student/Dockerfile
    container_name: sop_student
    restart: unless-stopped
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - POSTGRES_USER=${POSTGRES_USER:-ans_admin}
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB:-ans_praktyki}
      - FILESERVER_URL=${FILESERVER_URL:-http://fileserver:5003}
      - TEX_SERVICE_URL=http://tex-service:5002
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ALLOWED_EMAIL_DOMAIN=${ALLOWED_EMAIL_DOMAIN:-ans-elblag.pl}
    secrets:
      - secret_key
      - postgres_password
      - file_encryption_key
      - azure_client_id
      - azure_client_secret
      - azure_tenant_id
      - fileserver_api_key
    ports:
      - "8081:5001"
    networks:
      - internal
      - public
    depends_on:
      tex-service:
        condition: service_healthy
      db:
        condition: service_started
      redis:
        condition: service_started
      fileserver:
        condition: service_healthy
    volumes:
      - pdf_data:/app/pdf_output
      - ./app_student:/app/app_student:ro
      - ./core:/app/core:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery-worker:
    build:
      context: .
      dockerfile: celery_worker/Dockerfile
    container_name: sop_celery_worker
    restart: unless-stopped
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - POSTGRES_USER=${POSTGRES_USER:-ans_admin}
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB:-ans_praktyki}
      - FILESERVER_URL=${FILESERVER_URL:-http://fileserver:5003}
      - TEX_SERVICE_URL=http://tex-service:5002
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    secrets:
      - secret_key
      - postgres_password
      - file_encryption_key
      - fileserver_api_key
    command: celery -A celery_app worker --loglevel=info --concurrency=2
    networks:
      - internal
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_started
      tex-service:
        condition: service_healthy
    volumes:
      - pdf_data:/app/pdf_output
      - ./core:/app/core:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  celery-beat:
    build:
      context: .
      dockerfile: celery_worker/Dockerfile
    container_name: sop_celery_beat
    restart: unless-stopped
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - POSTGRES_USER=${POSTGRES_USER:-ans_admin}
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB:-ans_praktyki}
      - TEX_SERVICE_URL=http://tex-service:5002
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PDF_OUTPUT_DIR=/app/pdf_output
    secrets:
      - secret_key
      - postgres_password
    command: celery -A celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    networks:
      - internal
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_started
    volumes:
      - pdf_data:/app/pdf_output
      - ./core:/app/core:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  fileserver:
    build:
      context: ./fileserver
      dockerfile: Dockerfile
    container_name: sop_fileserver
    restart: unless-stopped
    secrets:
      - fileserver_api_key
    networks:
      - internal
    volumes:
      - fileserver_data:/data/files
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5003/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  tex-service:
    build:
      context: ./tex_service
      dockerfile: Dockerfile
    container_name: sop_tex_service
    restart: unless-stopped
    environment:
      - TZ=Europe/Warsaw
      - TEXMFVAR=/tmp/texmf-var
      - TEXMFCACHE=/tmp/texmf-var
      - HOME=/tmp
    volumes:
      - ./tex_service/templates:/app/templates:ro
    expose:
      - "5002"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /root:size=128m,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M

networks:
  # Sieć wewnętrzna — bez dostępu do internetu.
  # Wszystkie serwisy backendowe komunikują się wyłącznie przez tę sieć.
  internal:
    internal: true
  # Sieć publiczna — wyłącznie dla admin i student (porty 5000/5001).
  public:

volumes:
  pgdata:
  pdf_data:
  fileserver_data:
  redis_data:
