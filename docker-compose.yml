services:
  db:
    image: postgres:16-alpine
    container_name: sop_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ans_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ans_praktyki}
    ports:
      - "5432:5432"
    networks:
      - internal
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: sop_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - internal
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  admin:
    build:
      context: .
      dockerfile: app_admin/Dockerfile
    container_name: sop_admin
    restart: unless-stopped
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-ans_admin}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-ans_praktyki}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - TEX_SERVICE_URL=http://tex-service:5002
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "5000:5000"
    networks:
      - internal
      - public
    depends_on:
      tex-service:
        condition: service_healthy
      db:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - pdf_data:/app/pdf_output
      - uploads_data:/app/uploads
      - ./app_admin:/app/app_admin:ro
      - ./core:/app/core:ro
    read_only: true
    tmpfs:
      - /tmp
      - /app/app_admin/logs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  student:
    build:
      context: .
      dockerfile: app_student/Dockerfile
    container_name: sop_student
    restart: unless-stopped
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-ans_admin}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-ans_praktyki}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - TEX_SERVICE_URL=http://tex-service:5002
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "5001:5001"
    networks:
      - internal
      - public
    depends_on:
      tex-service:
        condition: service_healthy
      db:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - pdf_data:/app/pdf_output
      - uploads_data:/app/uploads
      - ./app_student:/app/app_student:ro
      - ./core:/app/core:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  celery-worker:
    build:
      context: .
      dockerfile: app_admin/Dockerfile
    container_name: sop_celery_worker
    restart: unless-stopped
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-ans_admin}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-ans_praktyki}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - TEX_SERVICE_URL=http://tex-service:5002
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    command: celery -A celery_app worker --loglevel=info --concurrency=2
    networks:
      - internal
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_started
      tex-service:
        condition: service_healthy
    volumes:
      - pdf_data:/app/pdf_output
      - uploads_data:/app/uploads
      - ./app_admin:/app/app_admin:ro
      - ./core:/app/core:ro
    read_only: true
    tmpfs:
      - /tmp
      - /app/app_admin/logs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  tex-service:
    build:
      context: ./tex_service
      dockerfile: Dockerfile
    container_name: sop_tex_service
    restart: unless-stopped
    environment:
      - TZ=Europe/Warsaw
    volumes:
      - ./tex_service/templates:/app/templates:ro
    expose:
      - "5002"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M

networks:
  # Sieć wewnętrzna — bez dostępu do internetu.
  # Wszystkie serwisy backendowe komunikują się wyłącznie przez tę sieć.
  internal:
    internal: true
  # Sieć publiczna — wyłącznie dla admin i student (porty 5000/5001).
  public:

volumes:
  pgdata:
  pdf_data:
  uploads_data:
  redis_data: