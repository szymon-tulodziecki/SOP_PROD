version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ans_postgres
    environment:
      POSTGRES_USER: ans_admin
      POSTGRES_PASSWORD: secure_password_123 
      POSTGRES_DB: ans_praktyki
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ans_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  worker:
    build:
      context: ../app_admin
      dockerfile: Dockerfile.worker
    container_name: ans_celery_worker
    environment:
      DATABASE_URL: postgresql+pg8000://ans_admin:secure_password_123@db:5432/ans_praktyki
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      FLASK_ENV: development
      SECRET_KEY: super-tajny-klucz-tylko-na-dev-xd
    volumes:
      - pdf_output:/app/pdf_output
    depends_on:
      - db
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  pdf_output: